<!doctype html><meta charset=utf-8><style>
* { box-sizing: border-box; margin: 0; }
html, body { width: 1280px; height: 360px; }

.chips { display: flex; gap: 12px; margin-top: 30px; }
.chip { font-size: 17px; font-weight: 600; padding: 9px 18px; border-radius: 999px;
  background: #1f232c; border: 1px solid #343a47; color: #8fd8f5; }
</style>
